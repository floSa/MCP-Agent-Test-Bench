# =============================================================================
# Squelette : un agent LangGraph branché sur des serveurs MCP et sur un LLM
# EXTERNE (Ollama ou vLLM). Ce fichier ne contient aucun LLM.
#
#   ┌────────┐       ┌──────────────────────┐   MCP (HTTP)   ┌────────────┐
#   │   ui   │ ────▶ │ agent  (LangGraph)   │ ─────────────▶ │ mcp-maths  │
#   └────────┘       │                      │ ─────────────▶ │ mcp-texte  │
#                    └──────────┬───────────┘                └────────────┘
#                               │ API /v1 (compatible OpenAI)
#                               ▼
#                    LLM : Ollama central, vLLM, ou Ollama local
#
# Le LLM se choisit par un fichier d'override (voir le Makefile) :
#   make up         -> docker-compose.llm-central.yml (service LLM partagé)
#   make up-local   -> docker-compose.llm-local.yml   (Ollama embarqué)
#
# Tests (sans LLM) : docker compose --profile test run --rm tests
# Tests e2e        : docker compose --profile e2e run --rm tests-e2e
# =============================================================================

services:

  # --- 1. Premier serveur MCP d'exemple : outils de calcul -----------------
  mcp-maths:
    build: ./mcp_servers
    container_name: mcp-maths
    command: ["python", "maths.py"]
    ports:
      - "8101:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- 2. Second serveur MCP d'exemple : outils sur le texte ---------------
  mcp-texte:
    build: ./mcp_servers
    container_name: mcp-texte
    command: ["python", "texte.py"]
    ports:
      - "8102:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- 3. L'agent : graphe LangGraph + LLM + outils MCP --------------------
  agent:
    build: ./agent
    container_name: agent
    ports:
      - "8080:8080"
    environment:
      # Valeurs par défaut : voir agent/config.py et .env.example.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama-central:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:e4b}
      LLM_API_KEY: ${LLM_API_KEY:-inutile}
    depends_on:
      mcp-maths:
        condition: service_healthy
      mcp-texte:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/sante', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- 4. L'interface Streamlit : appels MCP visibles en direct ------------
  ui:
    build: ./ui
    container_name: agent-ui
    ports:
      - "8501:8501"
    environment:
      AGENT_URL: http://agent:8080
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # --- 5. MCPJam : inspecteur MCP (tester les outils à la main) ------------
  # Ouvrir http://localhost:6274 puis connecter http://mcp-maths:8000/mcp/
  mcpjam:
    image: mcpjam/mcp-inspector:latest
    container_name: mcpjam
    ports:
      - "6274:6274"
    environment:
      HOST: 0.0.0.0
    depends_on:
      mcp-maths:
        condition: service_healthy
    restart: unless-stopped

  # --- 6. Tests unitaires + intégration (rapides, sans LLM) ----------------
  tests:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["test"]
    command: pytest tests -m "not e2e" -v --color=yes

  # --- 7. Tests de bout en bout (stack complète + vrai LLM) ----------------
  tests-e2e:
    build:
      context: .
      dockerfile: tests/Dockerfile
    profiles: ["e2e"]
    environment:
      AGENT_URL: http://agent:8080
      UI_URL: http://ui:8501
    depends_on:
      agent:
        condition: service_healthy
      ui:
        condition: service_healthy
    command: pytest tests -m e2e -v --color=yes
