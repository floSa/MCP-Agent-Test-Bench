# Override : l'agent se branche sur le service LLM CENTRAL (repo LLM-Service).
#
# Le réseau Docker partagé « llm-net » est créé par LLM-Service. L'agent y
# joint le conteneur « llm-central » (LiteLLM, API OpenAI sur le port 8080).
# L'adresse, le modèle et la clé se règlent dans .env (voir .env.example).
services:
  agent:
    networks:
      - default
      - llm-net

networks:
  llm-net:
    external: true
