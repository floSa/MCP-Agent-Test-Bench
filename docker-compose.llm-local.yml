# Override : Ollama EMBARQUÉ, pour qui n'a pas de service LLM central.
#
# Ajoute un conteneur Ollama dans cette stack et télécharge le modèle au premier
# démarrage. Si un service central existe, préférer docker-compose.llm-central.yml
# (un seul LLM en mémoire pour tous les projets).
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-local
    # GPU nvidia (toolkit nvidia-container requis). Sans GPU : supprimer ce
    # bloc « deploy », Ollama tournera sur CPU (beaucoup plus lent).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # OLLAMA_MODELES (.env) : dossier hôte partagé entre projets (modèles
      # téléchargés une seule fois). À défaut, volume local à ce projet.
      - ${OLLAMA_MODELES:-ollama_models}:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "ls"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-local-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${LLM_MODEL:-gemma4:e4b}"]
    restart: "no"

  agent:
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama-init:
        condition: service_completed_successfully
  mcp-calculatrice:
    environment:
      LLM_BASE_URL: http://ollama:11434/v1

volumes:
  ollama_models:
